<!doctype html>
<html lang="en" class="bg-slate-950">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI RevenueOS</title>
    <meta name="description" content="One AI system for every customer interaction. Global AI Revenue & Customer Operations Platform with AI Receptionist, Voice AI, CRM, Lead Follow-Up, Estimates, and Multi-Currency Billing Architecture (INR, USD, GBP) by AgentDesk Technologies." />
    <meta property="og:title" content="AI RevenueOS" />
    <meta property="og:description" content="One AI system for every customer interaction. Global AI Revenue & Customer Operations Platform with AI Receptionist, Voice AI, CRM, Lead Follow-Up, Estimates, and Multi-Currency Billing Architecture (INR, USD, GBP) by AgentDesk Technologies." />
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script>
      // Gracefully handle benign development HMR / preview container WebSocket closure events
      if (typeof window !== 'undefined') {
        window.addEventListener('unhandledrejection', function(event) {
          var reason = event.reason;
          var msg = (reason && reason.message) ? reason.message : String(reason || '');
          if (
            msg.indexOf('WebSocket') !== -1 ||
            msg.indexOf('websocket') !== -1 ||
            msg.indexOf('closed without opened') !== -1
          ) {
            event.preventDefault();
          }
        });
      }
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased min-h-screen overflow-x-hidden">
    <div id="root" class="min-h-screen bg-slate-950">
      <div id="app-boot-fallback" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #020617; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; padding: 24px; text-align: center;">
        <div style="width: 44px; height: 44px; border: 3px solid rgba(59, 130, 246, 0.2); border-top-color: #3b82f6; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px;"></div>
        <div style="font-size: 20px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 8px;">AI RevenueOS</div>
        <div style="font-size: 14px; color: #94a3b8; max-width: 320px;">Initializing workspace and AI agent services...</div>
      </div>
      <style>
        @keyframes spin { to { transform: rotate(360deg); } }
      </style>
    </div>
    <script>
      // Global fallback in the event of an asset or script load interruption before React boots
      window.addEventListener('error', function(e) {
        var fallback = document.getElementById('app-boot-fallback');
        if (fallback) {
          fallback.innerHTML = '<div style="max-width:520px;background:#0f172a;border:1px solid #334155;border-radius:16px;padding:28px;text-align:left;">' +
            '<h2 style="color:#f8fafc;font-size:18px;margin:0 0 10px;font-weight:700;">AgentDesk Initialization Notice</h2>' +
            '<p style="color:#94a3b8;font-size:14px;line-height:1.6;margin:0 0 16px;">The browser encountered an interruption while loading application assets. Please reload to refresh the workspace.</p>' +
            '<button onclick="window.location.reload()" style="background:#2563eb;color:#fff;border:none;padding:10px 18px;border-radius:8px;font-weight:600;cursor:pointer;font-size:14px;">Reload Application</button>' +
            '</div>';
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
