<!doctype html>
<html lang="en" class="bg-slate-950">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgentDesk</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="description" content="AgentDesk is an AI employee platform for customer conversations, lead capture, follow-up, booking, CRM, and business operations." />
    <meta property="og:title" content="AgentDesk" />
    <meta property="og:description" content="AgentDesk is an AI employee platform for customer conversations, lead capture, follow-up, booking, CRM, and business operations." />
    <script>
      if (typeof window !== 'undefined') {
        window.addEventListener('unhandledrejection', function(event) {
          var reason = event.reason;
          var msg = (reason && reason.message) ? reason.message : String(reason || '');
          if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('websocket') !== -1 || msg.indexOf('closed without opened') !== -1) {
            event.preventDefault();
          }
        });
      }
    </script>

    <script>
      // Voice transport fix:
      // The WebSocket is retained for the session greeting, but spoken questions
      // are routed through the already-working public widget chat engine. This
      // removes the broken voice-turn dependency while preserving the existing
      // ChatWidget response and speech-synthesis handling.
      (function installAgentDeskVoiceTransport() {
        if (typeof window === 'undefined' || !window.WebSocket || window.__agentDeskVoiceTransportInstalled) return;
        window.__agentDeskVoiceTransportInstalled = true;

        var NativeWebSocket = window.WebSocket;
        var nativeSend = NativeWebSocket.prototype.send;

        NativeWebSocket.prototype.send = function(data) {
          var socket = this;
          var url = String(socket.url || '');

          if (!url.includes('/ws/live-voice') || typeof data !== 'string') {
            return nativeSend.call(socket, data);
          }

          var payload;
          try {
            payload = JSON.parse(data);
          } catch (_) {
            return nativeSend.call(socket, data);
          }

          if (payload && payload.type === 'init') {
            socket.__agentDeskVoiceInit = payload;
            return nativeSend.call(socket, data);
          }

          if (!payload || (payload.type !== 'spoken_text' && payload.type !== 'text')) {
            return nativeSend.call(socket, data);
          }

          var init = socket.__agentDeskVoiceInit || {};
          var transcript = payload.text || payload.transcript || '';
          if (!transcript.trim()) return;

          (async function() {
            try {
              var response = await fetch('/api/widget/chat', {
                method: 'POST',
                credentials: 'same-origin',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  conversationId: init.conversationId,
                  businessId: init.businessId,
                  tenantId: init.tenantId || init.businessId,
                  agentId: init.agentId,
                  message: transcript,
                  conversationHistory: [],
                  recentMessages: [],
                  knowledgeBase: Array.isArray(init.knowledgeBase) ? init.knowledgeBase : []
                })
              });

              var result = null;
              try { result = await response.json(); } catch (_) {}

              var reply = result && typeof result.reply === 'string' && result.reply.trim()
                ? result.reply
                : "I am having trouble processing that right now. Please try asking again.";

              socket.dispatchEvent(new MessageEvent('message', {
                data: JSON.stringify({
                  type: 'response',
                  text: reply,
                  conversationId: init.conversationId,
                  conversationState: result && result.conversationState,
                  isClosing: Boolean(result && result.isClosing),
                  needsHumanHandoff: Boolean(result && result.needsHumanHandoff),
                  voice: (result && result.voice) || 'Puck',
                  userText: transcript,
                  timestamp: new Date().toISOString()
                })
              }));
            } catch (error) {
              console.error('[AgentDesk Voice] Chat engine request failed:', error);
              socket.dispatchEvent(new MessageEvent('message', {
                data: JSON.stringify({
                  type: 'response',
                  text: 'I am having trouble processing that right now. Please try asking again.',
                  conversationId: init.conversationId,
                  isClosing: false,
                  userText: transcript,
                  timestamp: new Date().toISOString()
                })
              }));
            }
          })();

          return;
        };
      })();
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased min-h-screen overflow-x-hidden">
    <div id="root" class="min-h-screen bg-slate-950">
      <div id="app-boot-fallback" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #020617; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; padding: 24px; text-align: center;">
        <div style="width: 44px; height: 44px; border: 3px solid rgba(59, 130, 246, 0.2); border-top-color: #3b82f6; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px;"></div>
        <div style="font-size: 20px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 8px;">AgentDesk</div>
        <div style="font-size: 14px; color: #94a3b8; max-width: 320px;">Initializing workspace and AI agent services...</div>
      </div>
      <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
    </div>
    <script>
      window.addEventListener('error', function(e) {
        var fallback = document.getElementById('app-boot-fallback');
        if (fallback) {
          fallback.innerHTML = '<div style="max-width:520px;background:#0f172a;border:1px solid #334155;border-radius:16px;padding:28px;text-align:left;">' +
            '<h2 style="color:#f8fafc;font-size:18px;margin:0 0 10px;font-weight:700;">AgentDesk Initialization Notice</h2>' +
            '<p style="color:#94a3b8;font-size:14px;line-height:1.6;margin:0 0 16px;">The browser encountered an interruption while loading application assets. Please reload to refresh the workspace.</p>' +
            '<button onclick="window.location.reload()" style="background:#2563eb;color:#fff;border:none;padding:10px 18px;border-radius:8px;font-weight:600;cursor:pointer;font-size:14px;">Reload Application</button>' +
            '</div>';
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
