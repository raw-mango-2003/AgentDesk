name: Security Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Dependency vulnerability audit
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Repository secret pattern check
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=dist --exclude='*.md' --exclude='security.yml'             '(sk-[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{20,}|-----BEGIN (RSA|EC|OPENSSH) PRIVATE KEY-----|TWILIO_AUTH_TOKEN=.{10,}|RAZORPAY_KEY_SECRET=.{10,})' .; then
            echo "Potential hard-coded secret detected."
            exit 1
          fi
