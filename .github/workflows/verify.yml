name: AgentDesk Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Production startup smoke test
        run: |
          set -e
          PORT=3000 npm start > /tmp/agentdesk-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health > /tmp/agentdesk-health.json; then
              break
            fi
            sleep 1
          done
          test -s /tmp/agentdesk-health.json
          curl -fsS http://127.0.0.1:3000/ > /tmp/agentdesk-home.html
          grep -q 'id="root"' /tmp/agentdesk-home.html
          echo "Production startup smoke test passed."
          cat /tmp/agentdesk-health.json

      - name: Customer journey E2E (isolated development database)
        run: |
          set -e
          NODE_ENV=development ENABLE_EMBEDDED_DB=true PORT=3000 npm run dev > /tmp/agentdesk-e2e-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health > /dev/null; then
              break
            fi
            sleep 1
          done
          npm run e2e:customer
