name: AgentDesk Verification

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start PostgreSQL service
        run: |
          set -e
          docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin <<< "${{ secrets.DOCKERHUB_TOKEN }}"
          docker run --name agentdesk-postgres \
            -e POSTGRES_USER=agentdesk \
            -e POSTGRES_PASSWORD=agentdesk-ci \
            -e POSTGRES_DB=agentdesk_ci \
            -p 5432:5432 -d postgres:16
          for i in $(seq 1 30); do
            if docker exec agentdesk-postgres pg_isready -U agentdesk -d agentdesk_ci; then
              exit 0
            fi
            sleep 2
          done
          echo "PostgreSQL did not become ready in time."
          docker logs agentdesk-postgres
          exit 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Production startup smoke test
        run: |
          set -e
          export SESSION_SECRET="$(openssl rand -hex 48)"
          export DATABASE_URL='postgresql://agentdesk:agentdesk-ci@127.0.0.1:5432/agentdesk_ci'
          export NODE_ENV=production
          export ENABLE_EMBEDDED_DB=false
          export PORT=3000
          npm start > /tmp/agentdesk-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health > /tmp/agentdesk-health.json; then
              break
            fi
            sleep 1
          done
          test -s /tmp/agentdesk-health.json
          grep -q '"success":true' /tmp/agentdesk-health.json
          grep -q '"status":"healthy"' /tmp/agentdesk-health.json
          grep -q '"database":{"connected":true' /tmp/agentdesk-health.json

          # Liveness must remain independent of the database readiness contract.
          curl -fsS http://127.0.0.1:3000/healthz > /tmp/agentdesk-liveness.json
          grep -q '"success":true' /tmp/agentdesk-liveness.json
          grep -q '"service":"AgentDesk"' /tmp/agentdesk-liveness.json
          grep -q '"status":"ok"' /tmp/agentdesk-liveness.json
          # Keep the liveness response intentionally shallow: it must not claim DB readiness.
          if grep -q '"database"' /tmp/agentdesk-liveness.json; then
            echo "Liveness endpoint must not report dependency readiness."
            exit 1
          fi

          curl -fsS http://127.0.0.1:3000/health > /tmp/agentdesk-health-alias.json
          grep -q '"status":"healthy"' /tmp/agentdesk-health-alias.json
          curl -fsS http://127.0.0.1:3000/ > /tmp/agentdesk-home.html
          grep -q 'id="root"' /tmp/agentdesk-home.html
          echo "Production startup and health-contract smoke tests passed."
          echo "Liveness response:"
          cat /tmp/agentdesk-liveness.json
          cat /tmp/agentdesk-health.json
          # Stop the smoke-test server before starting the auth E2E server on the same port.
          kill "$SERVER_PID" 2>/dev/null || true
          wait "$SERVER_PID" 2>/dev/null || true
          trap - EXIT

      - name: Platform admin auth E2E
        run: |
          set -e
          trap 'status=$?; if [ "$status" -ne 0 ]; then echo "===== AgentDesk auth E2E server log ====="; cat /tmp/agentdesk-auth-e2e.log || true; fi; kill ${SERVER_PID:-} 2>/dev/null || true; exit $status' EXIT
          export SESSION_SECRET="$(openssl rand -hex 48)"
          export DATABASE_URL='postgresql://agentdesk:agentdesk-ci@127.0.0.1:5432/agentdesk_ci'
          export NODE_ENV=production
          export ENABLE_EMBEDDED_DB=false
          export PLATFORM_ADMIN_EMAIL=e2e-admin@agentdesk.internal
          export PLATFORM_ADMIN_INITIAL_PASSWORD="$(openssl rand -hex 24)"
          export PORT=3001
          npm run dev > /tmp/agentdesk-auth-e2e.log 2>&1 &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3001/api/health > /dev/null; then
              break
            fi
            sleep 1
          done
          AGENTDESK_E2E_URL=http://127.0.0.1:3001 AGENTDESK_E2E_ADMIN_EMAIL=e2e-admin@agentdesk.internal AGENTDESK_E2E_ADMIN_PASSWORD="$PLATFORM_ADMIN_INITIAL_PASSWORD" npm run e2e:admin-auth

      - name: Customer journey E2E (isolated development database)
        run: |
          set -e
          NODE_ENV=development ENABLE_EMBEDDED_DB=true PORT=3002 npm run dev > /tmp/agentdesk-e2e-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3002/api/health > /dev/null; then
              break
            fi
            sleep 1
          done
          AGENTDESK_E2E_URL=http://127.0.0.1:3002 npm run e2e:customer
